[project]
name = "slackmd"
version = "0.0.1"
description = "Convert copied Slack messages to Markdown for agents, and Markdown to Slack formatting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Pure, cross-platform conversion core. Sandbox-safe: no I/O, no macOS, no network.
    "markdown-it-py>=3.0",
    "markdownify>=0.13",
]

[project.optional-dependencies]
# macOS clipboard adapter. Opt-in so the sandbox image never touches your pasteboard.
macos = ["pyobjc-framework-Cocoa>=10.0"]
# Slack API adapter (reverse direction / enrichment). Opt-in; dry-run by default. See SAFETY.md.
slack = ["slack_sdk>=3.27"]

[project.scripts]
slackmd = "slackmd.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slackmd"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-q"
